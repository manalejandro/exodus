services:
  node:
    build:
      context: .
      dockerfile: Dockerfile
#      args:
        # LLAMA_VERSION: "b10276"     # llama.cpp release tag
        # LLAMA_ASSET: "llama-b10276-bin-ubuntu-vulkan-x64.tar.gz" # or -ubuntu-x64 for CPU
        # CUDA_VERSION: "12.8.1"        # nvidia/cuda runtime base
        # UBUNTU_VERSION: "24.04"
    image: exodus:latest
    container_name: exodus-node
    restart: unless-stopped

    # ---- GPU support ------------------------------------------------------
    # Requires the NVIDIA Container Toolkit on the host:
    #   https://docs.nvidia.com/datacenter/cloud-native/container-toolkit
    #
    # This injects the host GPU driver; the image runs on an nvidia/cuda base
    # and bundles the prebuilt llama.cpp Vulkan build, so model layers are
    # offloaded to the VRAM via the NVIDIA Vulkan ICD.
    #
    # Legacy alternative: add `gpus: all` here instead of the deploy block.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    # ---- networking -------------------------------------------------------
    ports:
      - "52513:52513/udp"   # multicast discovery
      - "52514:52514/tcp"   # node gossip
      - "52515:52515/tcp"   # REST API + dashboard

    # ---- persistent state -------------------------------------------------
    volumes:
      - exodus-data:/data       # identity.key + ledger.sqlite3
      - exodus-models:/models   # local model files

    # ---- node configuration ------------------------------------------------
    environment:
      EXODUS_NODE_NAME: exodus-node
      # EXODUS_NODE_HOST: "0.0.0.0"        # override bind address
      # EXODUS_NODE_PORT: "52514"          # override gossip port
      # EXODUS_API_HOST: "0.0.0.0"         # override API bind address
      # EXODUS_API_PORT: "52515"           # override API port
      EXODUS_DISCOVER: "true"              # UDP multicast peer discovery
      # EXODUS_PEERS: "node2:52514,node3:52514"  # static bootstrap peers
      # GPU / inference tuning.  The node auto-detects the NVIDIA GPU wired in
      # by the toolkit (nvidia-smi / NVIDIA_VISIBLE_DEVICES) and advertises it
      # on /exodus/models and /exodus/status.  EXODUS_GPU_LAYERS sets how many
      # model layers are offloaded when a runtime uses the detected GPU.
      EXODUS_GPU_LAYERS: "35"               # layers offloaded to the GPU
      EXODUS_MODEL_DIR: "/models"           # where model files live
      # EXODUS_LLAMA_BIN: "/opt/llama.cpp/llama-cli"  # override inference binary
      # EXODUS_INFERENCE: "true"             # 0 -> chat returns the state stub
      # EXODUS_MAX_TOKENS: "256"             # max generated tokens per reply
      # EXODUS_INFERENCE_TIMEOUT_SECONDS: "300"  # kill llama-cli if it hangs past this

    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:52515/exodus/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

    stop_grace_period: 30s

  # One-off sanity check: runs the deterministic 5-node simulation.
  simulate:
    build:
      context: .
      dockerfile: Dockerfile
    image: exodus:latest
    profiles: ["simulate"]
    command: ["simulate exodus"]

volumes:
  exodus-data:
  exodus-models:
