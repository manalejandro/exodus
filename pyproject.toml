[project]
name = "exodus"
version = "0.1.0"
description = "Free, non-profit, distributed compute network — share your idle GPU/CPU, earn extra AI time."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
  { name = "exodus contributors" },
  { name = "exo project authors (upstream)", email = "hello@exolabs.net" },
]
dependencies = [
  "pydantic>=2.6.0",
  "anyio>=4.0.0",
  "cryptography>=42.0.0",
  "loguru>=0.7.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.110.0", "uvicorn>=0.29.0"]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0", "httpx>=0.27.0", "ruff>=0.5.0"]
# The upstream distributed-inference engine that exodus builds upon.
exo = ["exo@git+https://github.com/exo-explore/exo.git"]

[project.scripts]
exodus = "exodus.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
